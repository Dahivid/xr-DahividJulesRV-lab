<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Visor de Pieza 3D - Laboratorio RV</title>
    <!-- ENLACE CDN OFICIAL CORREGIDO -->
      <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
      /* Botón flotante para regresar al menú principal */
      .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 9999;
        padding: 10px 20px;
        background-color: #333333;
        color: white;
        text-decoration: none;
        font-family: sans-serif;
        font-weight: bold;
        border-radius: 5px;
        border: 2px solid #928dab;
        transition: 0.3s;
      }
      .back-button:hover {
        background-color: #928dab;
        color: black;
      }
      /* Fuerza al lienzo de la escena a renderizar un fondo blanco */
      a-scene {
        background-color: #FFFFFF;
      }
    </style>
  </head>
  <body>

    <!-- Botón de retorno al menú -->
    <a href="index.html" class="back-button">⬅ Volver al Menú</a>

    <!-- CORRECCIÓN: Se agrega background="color: #FFFFFF" a la escena y se quita el a-sky -->
    <a-scene background="color: #FFFFFF">
      <!-- SISTEMA DE GESTIÓN DE RECURSOS (Precarga tu archivo .glb) -->
      <a-assets>
        <a-asset-item id="modeloUnico" src="pieza.glb"></a-asset-item>
      </a-assets>

      <!-- CÁMARA CON CONTROLES (Te ubica de frente al objeto) -->
      <a-camera position="0 1.5 3"></a-camera>

      <!-- MODELO ESTÁTICO -->
      <a-gltf-model src="#modeloUnico" 
                    position="0 1.2 0" 
                    scale="1 1 1">
      </a-gltf-model>
    </a-scene>
  </body>
</html>
