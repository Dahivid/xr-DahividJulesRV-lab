<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi Laboratorio RV - Sistema Industrial</title>
    <!-- ENLACE CDN OFICIAL CORREGIDO -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- 1. PISO INDUSTRIAL Y PARED DE FONDO (a-plane) -->
      <a-plane rotation="-90 0 0" width="30" height="30" color="#555555"></a-plane>
      <a-plane position="0 7.5 -10" rotation="0 0 0" width="30" height="15" color="#333333"></a-plane>

      <!-- 2. CIELO / ENTORNO (a-sky) -->
      <a-sky color="#222222"></a-sky>

      <!-- 3. TANQUE DE ALMACENAMIENTO IZQUIERDO (a-cylinder, a-box, a-sphere) -->
      <!-- Soporte/Estructura del tanque -->
      <a-box position="-4 0.5 -5" width="2.5" height="1" depth="2.5" color="#777777"></a-box>
      <!-- Cuerpo del tanque (Fluido Azul) -->
      <a-cylinder position="-4 3.5 -5" radius="1" height="5" color="#0074D9"></a-cylinder>
      <!-- Sensor de nivel superior (Indicador Verde = OK) -->
      <a-sphere position="-4 6.2 -5" radius="0.2" color="#2ECC40"></a-sphere>

      <!-- 4. TANQUE DE ALMACENAMIENTO DERECHO (a-cylinder, a-box, a-sphere) -->
      <!-- Soporte/Estructura del tanque -->
      <a-box position="4 0.5 -5" width="2.5" height="1" depth="2.5" color="#777777"></a-box>
      <!-- Cuerpo del tanque (Fluido Químico Amarillo) -->
      <a-cylinder position="4 3.5 -5" radius="1" height="5" color="#FFDC00"></a-cylinder>
      <!-- Sensor de nivel superior (Indicador Rojo = Alerta/Lleno) -->
      <a-sphere position="4 6.2 -5" radius="0.2" color="#FF4136"></a-sphere>

      <!-- 5. SISTEMA CENTRAL: CINTA TRANSPORTADORA (a-box, a-cylinder) -->
      <!-- Estructura de la cinta -->
      <a-box position="0 0.75 -5" width="4" height="0.3" depth="1.2" color="#aaaaaa"></a-box>
      <!-- Ejes/Rodillos de la cinta (Extremo izquierdo y derecho) -->
      <a-cylinder position="-1.9 0.75 -5" rotation="90 0 0" radius="0.18" height="1.3" color="#FF851B"></a-cylinder>
      <a-cylinder position="1.9 0.75 -5" rotation="90 0 0" radius="0.18" height="1.3" color="#FF851B"></a-cylinder>
      
      <!-- Cajas de producción sobre la cinta (Escalamiento adecuado) -->
      <a-box position="-1 1.1 -5" width="0.5" height="0.4" depth="0.5" color="#85144b"></a-box>
      <a-box position="0.8 1.1 -5" width="0.5" height="0.4" depth="0.5" color="#85144b"></a-box>

      <!-- 6. TUBERÍAS DE CONEXIÓN INTERNAS (a-cylinder con jerarquía espacial) -->
      <!-- Tubería horizontal que conecta ambos tanques por detrás -->
      <a-cylinder position="0 5 -5" rotation="0 0 90" radius="0.15" height="8" color="#dddddd"></a-cylinder>
      <!-- Conectores verticales hacia la cinta -->
      <a-cylinder position="-2 3 -5" rotation="0 0 0" radius="0.1" height="4" color="#dddddd"></a-cylinder>
      <a-cylinder position="2 3 -5" rotation="0 0 0" radius="0.1" height="4" color="#dddddd"></a-cylinder>

      <!-- 7. PANEL DE CONTROL PRINCIPAL (a-box, a-sphere) -->
      <!-- Estructura del panel -->
      <a-box position="0 1 -2" width="1.2" height="1.5" depth="0.2" color="#444444" rotation="-10 0 0"></a-box>
      <!-- Botones / Sensores del panel -->
      <a-sphere position="-0.3 1.4 -1.9" radius="0.06" color="#2ECC40"></a-sphere> <!-- Botón Marcha -->
      <a-sphere position="0 1.4 -1.9" radius="0.06" color="#FF4136"></a-sphere>  <!-- Botón Paro -->
      <a-sphere position="0.3 1.4 -1.9" radius="0.06" color="#FF851B"></a-sphere> <!-- Alerta Amarilla -->
    </a-scene>
  </body>
</html>
