<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio RV - Menú Principal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .menu-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        p {
            color: #e0e0e0;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 250px;
            padding: 15px;
            margin: 15px auto;
            text-decoration: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-scene {
            background-color: #4CC3D9;
        }
        .btn-scene:hover {
            background-color: #3cb2c7;
            transform: translateY(-3px);
        }
        .btn-industrial {
            background-color: #FF851B;
        }
        .btn-industrial:hover {
            background-color: #e07315;
            transform: translateY(-3px);
        }
        .btn-pieza {
            background-color: #6B5B95;
        }
        .btn-pieza:hover {
            background-color: #554876;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>Laboratorio de RV</h1>
        <p>Selecciona la experiencia que deseas cargar:</p>
        
        <!-- Botón 1: Escena Básica -->
        <a href="basico.html" class="btn btn-scene">Escena Básica Inicial</a>
        
        <!-- Botón 2: Entorno Industrial -->
        <a href="industrial.html" class="btn btn-industrial">Zona Industrial Interactiva</a>

        <!-- NUEVO BOTÓN 3: Visor GLB Independiente -->
        <a href="pieza.html" class="btn btn-pieza">Visor de Pieza Individual</a>
    </div>

</body>
</html>
