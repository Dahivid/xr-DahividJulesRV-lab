<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi Primer Ejemplo RV</title>
    <!-- ENLACE CDN OFICIAL CORREGIDO -->
    <script src="https://aframe.io"></script>
    <style>
      /* Botón flotante para regresar al menú principal */
      .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 9999;
        padding: 10px 20px;
        background-color: #333333;
        color: white;
        text-decoration: none;
        font-family: sans-serif;
        font-weight: bold;
        border-radius: 5px;
        border: 2px solid #4CC3D9;
        transition: 0.3s;
      }
      .back-button:hover {
        background-color: #4CC3D9;
        color: black;
      }
    </style>
  </head>
  <body>

    <!-- Botón HTML en la interfaz 2D -->
    <a href="index.html" class="back-button">⬅ Volver al Menú</a>

    <a-scene>
      <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="2 1 -4" radius="1" color="#EF2D5E"></a-sphere>
      <a-cylinder position="-2 1 -4" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
