<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi Laboratorio RV - Vista Optimizada para Visor</title>
    <!-- ENLACE CDN OFICIAL CORREGIDO -->
    <script src="https://aframe.io"></script>
  </head>
  <body>
    <a-scene>
      <!-- CÁMARA OPTIMIZADA: Te posiciona en el lugar ideal para ver todo sin moverte -->
      <a-camera position="0 2 1"></a-camera>

      <!-- 1. PISO INDUSTRIAL Y PARED DE FONDO (Primitivas a-plane) -->
      <a-plane rotation="-90 0 0" width="30" height="30" color="#555555"></a-plane>
      <a-plane position="0 7.5 -10" rotation="0 0 0" width="30" height="15" color="#333333"></a-plane>

      <!-- 2. CIELO / ENTORNO (Primitiva a-sky) -->
      <a-sky color="#222222"></a-sky>

      <!-- 3. TANQUE IZQUIERDO (Primitivas a-box, a-cylinder, a-sphere) -->
      <a-box position="-4 0.5 -5" width="2.5" height="1" depth="2.5" color="#777777"></a-box>
      <a-cylinder position="-4 3.5 -5" radius="1" height="5" color="#0074D9"></a-cylinder>
      <a-sphere position="-4 6.2 -5" radius="0.2" color="#2ECC40"></a-sphere>

      <!-- 4. TANQUE DERECHO (Primitivas a-box, a-cylinder, a-sphere) -->
      <a-box position="4 0.5 -5" width="2.5" height="1" depth="2.5" color="#777777"></a-box>
      <a-cylinder position="4 3.5 -5" radius="1" height="5" color="#FFDC00"></a-cylinder>
      <a-sphere position="4 6.2 -5" radius="0.2" color="#FF4136"></a-sphere>

      <!-- 5. CINTA TRANSPORTADORA CON ANIMACIÓN (Primitivas a-box, a-cylinder) -->
      <a-box position="0 0.75 -5" width="4" height="0.3" depth="1.2" color="#aaaaaa"></a-box>
      
      <!-- Rodillos -->
      <a-cylinder position="-1.9 0.75 -5" rotation="90 0 0" radius="0.18" height="1.3" color="#FF851B"
                  animation="property: rotation; to: 90 360 0; loop: true; dur: 2000; easing: linear">
      </a-cylinder>
      <a-cylinder position="1.9 0.75 -5" rotation="90 0 0" radius="0.18" height="1.3" color="#FF851B"
                  animation="property: rotation; to: 90 360 0; loop: true; dur: 2000; easing: linear">
      </a-cylinder>
      
      <!-- Cajas móviles -->
      <a-box position="-1.8 1.1 -5" width="0.5" height="0.4" depth="0.5" color="#85144b"
             animation="property: position; from: -1.8 1.1 -5; to: 1.8 1.1 -5; loop: true; dur: 4000; easing: linear">
      </a-box>
      <a-box position="0.2 1.1 -5" width="0.5" height="0.4" depth="0.5" color="#85144b"
             animation="property: position; from: -1.8 1.1 -5; to: 1.8 1.1 -5; loop: true; dur: 4000; easing: linear; delay: 2000">
      </a-box>

      <!-- 6. TUBERÍAS DE CONEXIÓN (Primitivas a-cylinder) -->
      <a-cylinder position="0 5 -5" rotation="0 0 90" radius="0.15" height="8" color="#dddddd"></a-cylinder>
      <a-cylinder position="-2 3 -5" rotation="0 0 0" radius="0.1" height="4" color="#dddddd"></a-cylinder>
      <a-cylinder position="2 3 -5" rotation="0 0 0" radius="0.1" height="4" color="#dddddd"></a-cylinder>

      <!-- 7. PANEL DE CONTROL CORREGIDO (Más pequeño y ubicado abajo para no estorbar la vista) -->
      <a-box position="0 0.5 -1.8" width="0.6" height="0.75" depth="0.1" color="#444444" rotation="-20 0 0"></a-box>
      <!-- Botones e indicadores reducidos a escala -->
      <a-sphere position="-0.15 0.7 -1.75" radius="0.03" color="#2ECC40"></a-sphere> 
      <a-sphere position="0 0.7 -1.75" radius="0.03" color="#FF4136"></a-sphere>  
      <a-sphere position="0.15 0.7 -1.75" radius="0.03" color="#FF851B"></a-sphere> 
    </a-scene>
  </body>
</html>
