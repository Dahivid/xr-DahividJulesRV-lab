<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi Primer Ejemplo RV - Expandido</title>
    <!-- ENLACE CDN OFICIAL CORREGIDO -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
      /* Botón flotante para regresar al menú principal */
      .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 9999;
        padding: 10px 20px;
        background-color: #333333;
        color: white;
        text-decoration: none;
        font-family: sans-serif;
        font-weight: bold;
        border-radius: 5px;
        border: 2px solid #4CC3D9;
        transition: 0.3s;
      }
      .back-button:hover {
        background-color: #4CC3D9;
        color: black;
      }
    </style>
  </head>
  <body>

    <!-- Botón HTML en la interfaz 2D -->
    <a href="index.html" class="back-button">⬅ Volver al Menú</a>

    <a-scene>
      <!-- CÁMARA (Ubicada para apreciar la nueva distribución) -->
      <a-camera position="0 1.6 4"></a-camera>

      <!-- 1. FIGURAS ORIGINALES REPOSICIONADAS -->
      <!-- El cubo azul ahora está a la izquierda y más alto -->
      <a-box position="-2.5 2 -3.5" rotation="15 45 0" color="#4CC3D9"></a-box>
      
      <!-- La esfera rosa se mantiene a la derecha pero un poco más atrás -->
      <a-sphere position="2.5 1.5 -4.5" radius="0.8" color="#EF2D5E"></a-sphere>
      
      <!-- El cilindro amarillo se acerca un poco más al centro inferior -->
      <a-cylinder position="-1 0.75 -2.5" radius="0.4" height="1.5" color="#FFC65D"></a-cylinder>

      <!-- 2. NUEVAS FIGURAS EN DISTINTAS POSICIONES -->
      <!-- Un cono morado flotando en el lado derecho superior -->
      <a-cone position="1.5 2.2 -3" radius-bottom="0.5" height="1.2" color="#9B59B6" rotation="0 0 10"></a-cone>

      <!-- Un toroide (dona) de color verde lima en el centro de la escena -->
      <a-torus position="0 1.3 -3.5" radius="0.5" radius-tubular="0.1" color="#2ECC71" rotation="45 30 0"></a-torus>

      <!-- Un octaedro naranja en el extremo izquierdo cercano -->
      <a-octahedron position="-2 0.8 -2" radius="0.4" color="#E67E22"></a-octahedron>

      <!-- 3. ENTORNO (Suelo y Cielo) -->
      <a-plane rotation="-90 0 0" width="15" height="15" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
